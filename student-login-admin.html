<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login Management</title><style>body{font:16px Arial;background:#f3f7fc;color:#17243a;margin:0;padding:18px}.wrap{max-width:720px;margin:auto}.panel{background:white;padding:18px;border-radius:14px;margin:12px 0;border:1px solid #dce5f0}h1,h2{color:#12366a}input,select,button{font:inherit;padding:11px;border:1px solid #cbd6e5;border-radius:8px;width:100%;margin:6px 0}button{background:#12366a;color:white;font-weight:bold;border:0}.note{color:#64748b;font-size:13px}#status{white-space:pre-wrap}</style></head><body><main class="wrap"><h1>S. K. D. Academy, Dhawara</h1><section class="panel"><h2>विद्यार्थी Login ID और Password</h2><p class="note">यह पेज केवल Admin Login के बाद काम करेगा। विद्यार्थी का Login ID उसका Admission Number होगा।</p><div id="status">लोड हो रहा है…</div><label>विद्यार्थी चुनें</label><select id="student"><option value="">विद्यार्थी चुनें</option></select><label>नया Password (कम से कम 8 अक्षर)</label><input id="password" type="password" minlength="8" autocomplete="new-password"><button id="save">Password बनाएँ / Reset करें</button></section></main><script>const status=document.getElementById('status'),sel=document.getElementById('student');async function load(){try{const r=await fetch('/api/student-credentials'),d=await r.json();if(!r.ok)throw Error(d.error||'Admin Login जरूरी है।');sel.innerHTML='<option value="">विद्यार्थी चुनें</option>';for(const s of d.students){const o=document.createElement('option');o.value=s.profile_id;o.textContent=(s.admission_no||'No Admission No')+' — '+s.student_name+' ('+s.class_name+')'+(s.login_ready?' · Login बना है':' · Login नहीं बना');sel.append(o)}status.textContent='कुल विद्यार्थी: '+d.students.length}catch(e){status.textContent=e.message}}document.getElementById('save').onclick=async()=>{const password=document.getElementById('password').value;if(!sel.value||password.length<8){status.textContent='विद्यार्थी चुनें और कम से कम 8 अक्षर का पासवर्ड लिखें।';return}try{const r=await fetch('/api/student-credentials',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profileId:sel.value,password})}),d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('password').value='';status.textContent='पासवर्ड सफलतापूर्वक सेव हुआ।';load()}catch(e){status.textContent=e.message}};load();</script></body></html>
