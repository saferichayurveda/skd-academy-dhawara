<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12366a"><title>Student Login | S. K. D. Academy</title><link rel="manifest" href="/student.webmanifest"><link rel="icon" href="/logo.jpg"><style>*{box-sizing:border-box}body{margin:0;background:#eef3fa;font:16px Arial;color:#17243a;min-height:100vh;display:grid;place-items:center;padding:18px}.card{background:white;border:1px solid #dbe4ef;border-radius:20px;padding:26px;max-width:420px;width:100%;box-shadow:0 12px 40px #12366a18;text-align:center}.logo{width:100px;height:100px;object-fit:contain;border-radius:50%}h1{font-size:22px;color:#12366a;margin:12px 0 4px}.muted{color:#66758b;font-size:14px}.field{text-align:left;margin:16px 0}.field label{display:block;font-weight:bold;font-size:14px;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #cbd6e5;border-radius:10px;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#12366a;color:white;font-weight:bold;font-size:16px}.msg{padding:10px;border-radius:9px;background:#fff1ee;color:#9b291c;margin-top:14px;display:none}.hide{display:none}</style></head><body><main class="card"><img class="logo" src="/logo.jpg" alt="S. K. D. Academy logo"><h1>S. K. D. Academy, Dhawara</h1><p class="muted">Student Portal · विद्यार्थी लॉगिन</p><form id="f"><div class="field"><label>Admission Number / Login ID</label><input name="admissionNo" required autocomplete="username"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn">Login</button></form><section id="profile" class="hide"><h2 id="name"></h2><p id="details" class="muted"></p><button id="out" class="btn">Logout</button></section><div id="msg" class="msg" role="alert"></div><p class="muted">पासवर्ड भूलने पर विद्यालय कार्यालय से संपर्क करें।</p></main><script>const f=document.getElementById('f'),msg=document.getElementById('msg'),profile=document.getElementById('profile');function show(e){msg.textContent=e;msg.style.display='block'}async function check(){try{const r=await fetch('/api/student-session'),d=await r.json();if(d.authenticated){f.classList.add('hide');profile.classList.remove('hide');document.getElementById('name').textContent=d.student.student_name;document.getElementById('details').textContent='कक्षा: '+d.student.class_name+' · Admission No.: '+d.student.admission_no}}catch{}}f.onsubmit=async e=>{e.preventDefault();msg.style.display='none';const b=Object.fromEntries(new FormData(f));try{const r=await fetch('/api/student-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)return show(d.error||'Login नहीं हुआ।');await check()}catch{show('Internet या server connection जाँचें।')}};document.getElementById('out').onclick=async()=>{await fetch('/api/student-session',{method:'DELETE'});location.reload()};check();</script></body></html>
