<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admit Cards | S. K. D. Academy</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#111;font:13px/1.35 Arial,sans-serif}.toolbar{max-width:900px;margin:14px auto;padding:12px;background:#fff;border:1px solid #ccd3dd;border-radius:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar button,.toolbar a{border:0;border-radius:7px;padding:10px 14px;background:#12366a;color:white;text-decoration:none;font-weight:bold}.toolbar .muted{background:#e8edf4;color:#12366a}.status{flex-basis:100%;white-space:pre-wrap;color:#234}.sheets{width:210mm;margin:0 auto}.sheet{width:210mm;height:297mm;background:white;padding:5mm 7mm;display:flex;flex-direction:column;gap:4mm;page-break-after:always;break-after:page}.card{height:141.5mm;border:1.5px solid #111;padding:4mm 5mm;position:relative;overflow:hidden;display:flex;flex-direction:column}.cutline{border-top:1px dashed #555;position:relative;height:0;flex:0 0 0}.cutline:after{content:'✂';position:absolute;right:0;top:-10px;background:#fff;padding:0 4px}.head{display:flex;align-items:center;gap:9px;border-bottom:1.5px solid #111;padding-bottom:5px}.logo{width:48px;height:48px;object-fit:contain}.school{text-align:center;flex:1}.school h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.3px}.school p{margin:2px 0;font-size:10px}.examtitle{text-align:center;font-size:14px;font-weight:bold;margin:6px 0 4px;text-decoration:underline}.identity{display:grid;grid-template-columns:1fr 29mm;gap:7px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}.field{border-bottom:1px dotted #444;min-height:22px;padding:2px 0}.field b{font-size:11px}.photo{border:1px solid #777;height:29mm;display:flex;align-items:center;justify-content:center;color:#777;font-size:10px;text-align:center}.schedule{width:100%;border-collapse:collapse;margin-top:6px;font-size:10.5px}.schedule th,.schedule td{border:1px solid #555;padding:3px 5px;text-align:left}.schedule th{background:#eee}.schedule caption{text-align:left;font-weight:bold;padding:2px 0}.bottom{display:flex;justify-content:space-between;align-items:end;margin-top:auto;padding-top:6px;font-size:10px}.instructions{font-size:9.5px;margin-top:5px}.instructions b{display:block;margin-bottom:2px}.instructions ul{margin:2px 0 0;padding-left:16px;columns:2}.instructions li{margin-bottom:1px}.sign{border-top:1px solid #222;padding-top:3px;min-width:35mm;text-align:center}.empty{padding:20px;background:white;margin:20px}
@page{size:A4 portrait;margin:0}
@media print{body{background:white}.toolbar{display:none!important}.sheets{width:210mm}.sheet{margin:0;box-shadow:none}.card{break-inside:avoid}}
</style></head><body>
<div class="toolbar"><a class="muted" href="/school-office.html">← School Office</a><button id="load">डेटाबेस से विद्यार्थी लोड करें</button><button id="print" disabled>सभी Admit Card PDF / Print</button><span id="count">डेटा लोड नहीं हुआ।</span><div id="status" class="status">पहले Admin Login करें।</div></div>
<div id="sheets" class="sheets"><div class="empty">Admin Login के बाद “डेटाबेस से विद्यार्थी लोड करें” दबाएँ।</div></div>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url){const r=await fetch(url,{credentials:"same-origin"});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||"HTTP "+r.status);return j}
function groupClass(raw){let s=String(raw||"").toLowerCase().replace(/\s+/g,"").replace(/^class/,"");if(["nursery","nursary","nur"].includes(s))return"nursery";if(["lkg","l.k.g."].includes(s))return"lkg";if(["ukg","u.k.g."].includes(s))return"ukg";let n=Number(s);if(Number.isInteger(n)&&n>=1&&n<=5)return"primary";if(Number.isInteger(n)&&n>=6&&n<=8)return"middle";if(n===9)return"nine";return"other"}
const schedules={
 nursery:[["17/11/26 मंगलवार","Hindi Written"],["18/11/26 बुधवार","Math Written"],["19/11/26 गुरुवार","English Written"],["20/11/26 शुक्रवार","Hindi Oral / Art"],["21/11/26 शनिवार","Math Oral"],["23/11/26 सोमवार","English Oral"]],
 lkg:[["17/11/26 मंगलवार","Hindi Written"],["18/11/26 बुधवार","Math Written"],["19/11/26 गुरुवार","English Written"],["20/11/26 शुक्रवार","Hindi Oral / Art"],["21/11/26 शनिवार","Math Oral"],["23/11/26 सोमवार","English Oral"]],
 ukg:[["17/11/26 मंगलवार","Hindi Written"],["18/11/26 बुधवार","Math Written"],["19/11/26 गुरुवार","English Written"],["20/11/26 शुक्रवार","Hindi Oral / Art"],["21/11/26 शनिवार","Math Oral"],["23/11/26 सोमवार","English Oral"]],
 primary:[["17/11/26 मंगलवार","Hindi / GK"],["18/11/26 बुधवार","Art"],["19/11/26 गुरुवार","English"],["20/11/26 शुक्रवार","Math"],["21/11/26 शनिवार","EVS"],["23/11/26 सोमवार","Computer"]],
 middle:[["17/11/26 मंगलवार","Hindi / GK"],["18/11/26 बुधवार","Science / Art"],["19/11/26 गुरुवार","English"],["20/11/26 शुक्रवार","Math"],["21/11/26 शनिवार","SST"],["23/11/26 सोमवार","Computer"]],
 nine:[["17/11/26 मंगलवार","Hindi"],["18/11/26 बुधवार","English"],["19/11/26 गुरुवार","H. Science"],["20/11/26 शुक्रवार","S. St"],["21/11/26 शनिवार","Science"],["23/11/26 सोमवार","Art"]]
};
function card(s){const g=groupClass(s.class_name),rows=schedules[g]||[];const schedule=rows.length?rows.map(r=>"<tr><td>"+r[0]+"</td><td>"+r[1]+"</td></tr>").join(""):'<tr><td colspan="2">इस कक्षा की परीक्षा-सारणी उपलब्ध नहीं है। कृपया कार्यालय से संपर्क करें।</td></tr>';
return '<article class="card"><div class="head"><img class="logo" src="/logo.jpg" alt="Logo"><div class="school"><h1>S. K. D. ACADEMY, DHAWARA</h1><p>Dhawara, Karitin, Kushinagar (U.P.)</p><p><b>2nd Term Examination 2026–27</b></p></div></div><div class="examtitle">प्रवेश-पत्र / ADMIT CARD</div><div class="identity"><div class="fields"><div class="field"><b>विद्यार्थी का नाम:</b> '+esc(s.student_name)+'</div><div class="field"><b>कक्षा:</b> '+esc(s.class_name)+'</div><div class="field"><b>पिता का नाम:</b> '+esc(s.father_name||"—")+'</div><div class="field"><b>प्रवेश संख्या:</b> '+esc(s.admission_no||"—")+'</div><div class="field"><b>जन्मतिथि:</b> '+esc(s.dob||"—")+'</div><div class="field"><b>परीक्षा समय:</b> 9:00 AM से 12:00 PM</div></div><div class="photo">विद्यार्थी का<br>फोटो</div></div><table class="schedule"><caption>परीक्षा कार्यक्रम</caption><thead><tr><th>दिनांक / दिन</th><th>विषय</th></tr></thead><tbody>'+schedule+'</tbody></table><div class="instructions"><b>महत्वपूर्ण निर्देश:</b><ul><li>परीक्षा प्रतिदिन सुबह 9:00 से दोपहर 12:00 बजे तक होगी।</li><li>निर्धारित विषय की परीक्षा के दिन ही उपस्थित हों।</li><li>विद्यालय की यूनिफॉर्म अनिवार्य है।</li><li>15 मिनट पहले विद्यालय पहुँचें।</li><li>अनुशासन बनाए रखें; नकल वर्जित है।</li><li>परीक्षा की तिथियों में परिवर्तन नहीं होगा।</li></ul></div><div class="bottom"><div>अभिभावक के हस्ताक्षर<br>__________________</div><div class="sign">प्रधानाचार्य<br><b>D. K. Pandey</b></div></div></article>'}
function render(list){let html="";for(let i=0;i<list.length;i+=2){html+='<section class="sheet">'+card(list[i]);if(list[i+1])html+='<div class="cutline"></div>'+card(list[i+1]);else html+='<div class="card" style="border:0"></div>';html+='</section>'}$("#sheets").innerHTML=html||'<div class="empty">कोई विद्यार्थी रिकॉर्ड नहीं मिला।</div>';$("#count").textContent=list.length+" विद्यार्थी · "+Math.ceil(list.length/2)+" A4 पेज";$("#print").disabled=!list.length}
$("#load").onclick=async()=>{try{$("#status").textContent="डेटाबेस से रिकॉर्ड लोड हो रहे हैं…";const j=await api("/api/student-profiles");const list=(j.students||[]).sort((a,b)=>String(a.class_name).localeCompare(String(b.class_name),undefined,{numeric:true})||String(a.student_name).localeCompare(String(b.student_name)));render(list);$("#status").textContent="सफल: "+list.length+" विद्यार्थी लोड हुए। कोई रिकॉर्ड बदला नहीं गया।"}catch(e){$("#status").textContent=e.message+" — यदि Login नहीं है तो School Office में Admin Login करें।"}};
$("#print").onclick=()=>window.print();
(async()=>{try{const j=await api("/api/session");$("#status").textContent=j.authenticated?"Admin Login सफल। अब विद्यार्थी लोड करें।":"पहले Admin Login करें।";}catch(e){$("#status").textContent=e.message}})();
</script></body></html>
