<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SKD Student Progress Report</title><style>
body{font:16px Arial,sans-serif;background:#f3f6fb;color:#17243a;margin:0}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce5f0;border-radius:12px;padding:18px;margin:14px 0}h1,h2{color:#12366a}label{display:block;font-weight:bold;margin:12px 0 5px}input,button{font:inherit;padding:12px;border:1px solid #cbd6e5;border-radius:8px;width:100%;box-sizing:border-box}button{background:#12366a;color:#fff;border:0;font-weight:bold;cursor:pointer;margin-top:12px}.hidden{display:none}.status{padding:10px;background:#eaf1fa;border-radius:8px;white-space:pre-wrap}.report{padding:12px 0;border-top:1px solid #e6edf5}.viewer{width:100%;height:75vh;border:1px solid #dce5f0;border-radius:8px}.note{color:#627086;font-size:13px}
</style></head><body><main class="wrap"><h1>S. K. D. Academy, Dhawara</h1><h2>विद्यार्थी Progress Report</h2><div id="status" class="status">कृपया Login ID और PIN डालें।</div><section id="login" class="card"><form id="loginForm"><label>Login ID</label><input name="loginId" autocomplete="username" required maxlength="40"><label>8 अंकों का PIN</label><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="current-password" required><button>Login करें</button></form></section><section id="portal" class="hidden"><div class="card"><div id="student"></div><button id="logout">Logout</button></div><div class="card"><h2>आपकी Progress Report</h2><div id="reports"></div><div id="viewerBox" class="hidden"><iframe id="viewer" class="viewer" title="आपकी Progress Report" referrerpolicy="no-referrer"></iframe></div><p class="note">रिपोर्ट निजी signed link से खुलती है। लिंक थोड़े समय बाद समाप्त हो जाता है।</p></div></section></main>
<script src="/supabase-config.js"></script><script>
const $=s=>document.querySelector(s),base=window.SKD_SUPABASE_FUNCTIONS;let parentToken="";
function msg(s){$("#status").textContent=s}
async function api(data){if(!base||base.includes("YOUR_PROJECT_REF"))throw Error("Supabase Project Ref अभी सेट नहीं है।");const r=await fetch(base+"/parent-portal",{method:"POST",headers:{"Content-Type":"application/json",...(parentToken?{Authorization:"Bearer "+parentToken}:{})},body:JSON.stringify(data)});let b={};try{b=await r.json()}catch{}if(!r.ok)throw Error(b.error||"अनुरोध पूरा नहीं हुआ।");return b}
async function show(){const b=await api({action:"reports"});$("#login").classList.add("hidden");$("#portal").classList.remove("hidden");$("#student").textContent=b.student.name+" · कक्षा "+b.student.className;$("#reports").innerHTML=b.reports.length?b.reports.map(r=>'<div class="report"><b>'+r.report_title+'</b><br>'+r.academic_session+' <button data-id="'+r.id+'">रिपोर्ट देखें</button></div>').join(""):"अभी आपकी Progress Report प्रकाशित नहीं हुई है।";msg("Login सफल। केवल इसी विद्यार्थी की रिपोर्ट उपलब्ध है।")}
$("#loginForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const b=await api({action:"login",loginId:f.get("loginId"),pin:f.get("pin")});parentToken=b.token;await show()}catch(x){msg(x.message)}};
$("#reports").onclick=async e=>{if(e.target.dataset.id){try{const b=await api({action:"report",reportId:e.target.dataset.id});$("#viewer").src=b.url;$("#viewerBox").classList.remove("hidden")}catch(x){msg(x.message)}}};
$("#logout").onclick=()=>{parentToken="";$("#portal").classList.add("hidden");$("#login").classList.remove("hidden");$("#viewer").removeAttribute("src");$("#viewerBox").classList.add("hidden");msg("Logout हो गया।")};
</script></body></html>
