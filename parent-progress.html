<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Student Progress Report</title><style>
body{font:16px Arial,sans-serif;background:#f3f6fb;color:#17243a;margin:0}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:white;border:1px solid #dce5f0;border-radius:12px;padding:18px;margin:14px 0}h1,h2{color:#12366a}label{display:block;font-weight:bold;margin:12px 0 5px}input,button{font:inherit;padding:12px;border:1px solid #cbd6e5;border-radius:8px;width:100%;box-sizing:border-box}button{background:#12366a;color:white;border:0;font-weight:bold;cursor:pointer;margin-top:12px}.hidden{display:none}.status{padding:10px;background:#eaf1fa;border-radius:8px;white-space:pre-wrap}.report{padding:12px 0;border-top:1px solid #e6edf5}.viewer{width:100%;height:75vh;border:1px solid #dce5f0;border-radius:8px}.note{color:#627086;font-size:13px}</style></head><body><main class="wrap"><h1>S. K. D. Academy, Dhawara</h1><h2>विद्यार्थी Progress Report</h2><div id="status" class="status">कृपया Login ID और PIN डालें।</div><section id="login" class="card"><form id="loginForm"><label>Login ID</label><input name="loginId" autocomplete="username" required maxlength="40"><label>8 अंकों का PIN</label><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="current-password" required><button>Login करें</button></form></section><section id="portal" class="hidden"><div class="card"><div id="student"></div><button id="logout">Logout</button></div><div class="card"><h2>आपकी Progress Report</h2><div id="reports"></div><div id="viewerBox" class="hidden"><iframe id="viewer" class="viewer" title="आपकी Progress Report" referrerpolicy="no-referrer"></iframe></div><p class="note">यह केवल देखने के लिए है। इस पेज पर Print या Download बटन नहीं दिया गया है। स्क्रीनशॉट/फोटो लेने पर पूर्ण रोक संभव नहीं है।</p></div></section></main><script>
const $=s=>document.querySelector(s);async function api(url,opts={}){const r=await fetch(url,{credentials:"same-origin",...opts});const ct=r.headers.get("content-type")||"";if(!r.ok){let b={};try{b=await r.json()}catch{}throw Error(b.error||"अनुरोध पूरा नहीं हुआ।")}return ct.includes("application/json")?r.json():r}
function msg(s){$("#status").textContent=s}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function show(){const b=await api("/api/parent-report");$("#login").classList.add("hidden");$("#portal").classList.remove("hidden");$("#student").textContent=b.student.name+" · कक्षा "+b.student.className;$("#reports").innerHTML=b.reports.length?b.reports.map(r=>'<div class="report"><b>'+esc(r.report_title)+'</b><br>'+esc(r.academic_session)+' <button data-id="'+esc(r.id)+'">रिपोर्ट देखें</button></div>').join(""):"अभी आपकी Progress Report प्रकाशित नहीं हुई है।";msg("Login सफल। केवल इसी विद्यार्थी की रिपोर्ट उपलब्ध है।")}
$("#loginForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api("/api/parent-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({loginId:f.get("loginId"),pin:f.get("pin")})});await show()}catch(x){msg(x.message)}};
$("#reports").onclick=async e=>{if(e.target.dataset.id){try{const r=await api("/api/parent-report?id="+encodeURIComponent(e.target.dataset.id));$("#viewer").src=URL.createObjectURL(await r.blob());$("#viewerBox").classList.remove("hidden")}catch(x){msg(x.message)}}};
$("#logout").onclick=async()=>{try{await api("/api/parent-report",{method:"DELETE"});$("#portal").classList.add("hidden");$("#login").classList.remove("hidden");$("#viewer").removeAttribute("src");$("#viewerBox").classList.add("hidden");msg("Logout हो गया।")}catch(e){msg(e.message)}};
</script></body></html>
